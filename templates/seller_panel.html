{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel ="stylesheet" href ="{% static 'css/style.css' %}">

    <title>Seller Dashboard</title>

    <style>
/* Global Styles */
* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-color: #f4f6f9;
    color: #333;
}

/* Navigation Bar */
nav {
    background: #2c3e50;
    width: 100%;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

nav h1 {
    color: white;
    font-size: 24px;
    font-weight: 600;
}

nav button {
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 5px;
    background-color: #27ae60;
    border: none;
    color: white;
    transition: all 0.3s ease-in-out;
    cursor: pointer;
    font-size: 16px;
}

nav button:hover {
    background-color: #219150;
}

nav button:active {
    transform: scale(0.95);
}

/* Table Styling */
table {
    width: 90%;
    margin: 30px auto;
    border-collapse: collapse;
    background: white;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

th {
    background: #34495e;
    color: white;
    text-transform: uppercase;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

tr:hover {
    background-color: #ecf0f1;
}

td img {
    width: 50px;
    height: auto;
    border-radius: 5px;
}

/* Buttons in Table */
td a button, .btns {
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

td a button {
    background-color: #2980b9;
    color: white;
}

td a button:hover {
    background-color: #1f6690;
}

.btns {
    background-color: #e74c3c;
    color: white;
}

.btns:hover {
    background-color: #c0392b;
}

/* Popup Modal */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 25px;
    border-radius: 8px;
    width: 400px;
    text-align: center;
    position: relative;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
}

.close-btn {
    position: absolute;
    top: 12px;
    right: 15px;
    font-size: 24px;
    cursor: pointer;
    color: #e74c3c;
}

.close-btn:hover {
    color: #c0392b;
}

/* Form Styling */
form {
    display: flex;
    flex-direction: column;
    padding: 10px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    transition: 0.3s;
}

input:focus, textarea:focus {
    border-color: #3498db;
    outline: none;
    box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
}

input[type="submit"] {
    background-color: #27ae60;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    font-size: 16px;
    border: none;
    padding: 12px;
    border-radius: 5px;
}

input[type="submit"]:hover {
    background-color: #219150;
}

/* Responsive Design */
@media (max-width: 768px) {
    table {
        width: 100%;
    }

    .popup-content {
        width: 90%;
    }
}

    </style>
</head>

<body>

    <nav>
        <h1> Welcome, {{ username }}</h1>
        <button onclick="openPopup()">Add Product</button>
    </nav>

    <div>
        <table>
            <tr>
                <th>name</th>
                <th>price</th>
                <th>stock</th>
                <th>category</th>
                <th>description</th>
                <th>image</th>
                <th>modify</th>
            </tr>

            {% for i in data %}
            <tr>
                <td>{{ i.product_name }}</td>
                <td>{{ i.price }}</td>
                <td>{{ i.stock }}</td>
                <td>{{ i.category }}</td>
                <td>{{ i.description }}</td>
                <td><img src="{{ i.image.url }}"  width="150"></td>
                <td>
                <a href="{% url 'update_product' i.id %}" ><button>Edit</button></a>
                <!-- <a href="{% url 'delete_product' i.id %}"><button>Delete</button></a> -->

                <button class="btns btns2" onclick="remove(this)"
                        data-url="{% url 'delete_product' i.id %}">Remove</button>
                </td>
                
            </tr>
            {% endfor %}
            



        </table>
    </div>

    <!-- Popup Modal -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <h2>Add Product</h2>
            <form action="{% url 'seller_panel' %}" enctype="multipart/form-data" method="POST">
                {% csrf_token %}
                <input type="text" name="name" placeholder="Enter product name" required>
                <input type="text" name="price" placeholder="Enter product price" required>
                <input type="text" name="stock" placeholder="Enter product stock" required>
                <textarea name="description" placeholder="Enter product description" required></textarea>
                <input type="text" name="category" placeholder="Enter product category" required>
                <input type="file" name="image" required>
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>

   

    <script>
        function openPopup() {
            document.getElementById("popup").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }

        // Close the popup when clicking outside of it
        window.addEventListener("click", function (event) {
            let popup = document.getElementById("popup");
            if (event.target === popup) {
                closePopup();
            }
        });


        function remove(button) {
            var r = confirm("Are you sure you want to delete this product?");
            if (r == true) {
                var url = button.getAttribute("data-url");
                window.location.href = url;
            }
        }
    </script>

</body>

</html>
